{# Shared fields for the new-entry and edit-entry forms. Expects `form`, `cfg`, `today`. #}
<div class="form-section-label">Student</div>
<div class="field autocomplete-wrap">
  <label for="name-input">Student name</label>
  <input type="text" id="name-input" name="name" value="{{ form.get('name', '') }}" autocomplete="off" placeholder="Type a name or student ID">
  <div class="autocomplete-list" id="name-list" role="listbox"></div>
</div>
<div class="field">
  <label for="student-id-input">Student ID</label>
  <input type="text" id="student-id-input" name="student_id" value="{{ form.get('student_id', '') }}" autocomplete="off" placeholder="e.g. STU003">
</div>
<div class="field">
  <label for="date-input">Date of entry</label>
  <input type="date" id="date-input" name="date" value="{{ form.get('date', '') }}" max="{{ today.isoformat() }}" required>
</div>
<div class="field">
  <label for="class-input">Class</label>
  <input type="text" id="class-input" name="klass" class="is-auto" value="{{ form.get('klass', '') }}" placeholder="Filled in automatically">
</div>
<div class="field">
  <label for="section-input">Section</label>
  <input type="text" id="section-input" name="section" class="is-auto" value="{{ form.get('section', '') }}" placeholder="Filled in automatically">
</div>
<div class="field">
  <label for="house-input">House</label>
  <input type="text" id="house-input" name="house" class="is-auto" value="{{ form.get('house', '') }}" placeholder="Filled in automatically">
</div>
{# Empty unless a typed name or ID isn't in the master list. #}
<p class="status-line" id="student-status" aria-live="polite" hidden></p>
<div class="form-section-label">Details</div>
{% for field, itype in cfg.extra_fields %}
<div class="field">
  <label for="extra-{{ loop.index }}">{{ field }}</label>
  <input type="text" id="extra-{{ loop.index }}" name="{{ field }}" value="{{ form.get(field, '') }}" placeholder="{{ 'e.g. 8:45 AM' if field == 'Time' else field }}">
</div>
{% endfor %}
<div class="field">
  <label for="logged-by-input">Logged by (staff name)</label>
  <input type="text" id="logged-by-input" name="logged_by" value="{{ form.get('logged_by', '') }}" placeholder="e.g. Mrs. Rao">
</div>
<div class="field span-all">
  <label for="remarks-input">Remarks</label>
  <textarea id="remarks-input" name="remarks" placeholder="Any additional notes">{{ form.get('remarks', '') }}</textarea>
</div>
